name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify. Empty = latest release.
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: windows-latest
    # Read-only: the build output is never uploaded as a release asset.
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore optimizerDuck.slnx

      - name: Build
        run: dotnet build optimizerDuck.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet run --project optimizerDuck.Test/optimizerDuck.Test.csproj --configuration Release --no-build -- -longRunning 30

      - name: Publish Single
        run: |
          dotnet publish optimizerDuck/optimizerDuck.csproj --nologo /p:PublishProfile=Single
        shell: pwsh

      - name: Resolve release tag
        id: get_version
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ inputs.tag }}"
          if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
          if (-not $tag) {
            $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          }
          if (-not $tag) {
            Write-Host "::error::No release tag resolved"
            exit 1
          }
          $version = $tag -replace '^v', ''
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Verifying release build $tag (version $version)"

      - name: Rename output file
        run: |
          $version = "${{ steps.get_version.outputs.version }}"
          # The published binary gets a stable, versioned file name so that the copy uploaded
          # to the official website is unambiguous.
          $source = "optimizerDuck/bin/Release/Single/net10.0/publish/win-x64/LiteClean.exe"
          $dest = "LiteClean-Windows-x64-$version.exe"
          Move-Item -Path $source -Destination $dest
        shell: pwsh

      # NOTE: the binary is deliberately NOT attached to the GitHub release.
      # The ready-to-run build is distributed from the official website only, so that it is
      # not obtainable free of charge through GitHub. The source code stays public, which is
      # all that the GNU GPL v3.0 requires (section 6) — see NOTICE.md.
      - name: Record build checksum
        shell: pwsh
        run: |
          $file = "LiteClean-Windows-x64-${{ steps.get_version.outputs.version }}.exe"
          $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash
          $sizeMb = [math]::Round((Get-Item $file).Length / 1MB, 2)
          $summary = @(
            "### Release build verified",
            "",
            "| | |",
            "| --- | --- |",
            "| File | ``$file`` |",
            "| Size | $sizeMb MB |",
            "| SHA-256 | ``$hash`` |",
            "",
            "The binary is intentionally **not** attached to this release: the ready-to-run build",
            "is distributed from the official website only. Make sure the file uploaded there has",
            "the same SHA-256 as above.",
            "",
            "Source code (required by GNU GPL v3.0 section 6): https://github.com/${{ github.repository }}"
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Write-Host "::notice::Build verified - SHA-256 $hash ($sizeMb MB)"

